<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You 💖</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 90%;
            position: relative;
        }
        h1 {
            color: #ff4d6d;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
        }
        .gif-container img {
            width: 150px;
            height: 150px;
            margin: 15px 0;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 50px;
            position: relative;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #noBtn {
            background-color: #f0f0f0;
            color: #333;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">I Love You ❤️</h1>
        <p id="subtitle">ပြန်ချစ်ပါနော် 🥺</p>
        
        <div class="gif-container">
            <img id="bearGif" src="https://media.tenor.com/X-c696Gz8w8AAAAi/milk-and-mocha-bear.gif" alt="Bears">
        </div>

        <div class="btn-group">
            <button id="yesBtn" onclick="selectYes()">ချစ်တယ် 💖</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">မချစ်ဘူး 😢</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const bearGif = document.getElementById('bearGif');

        // မချစ်ဘူး ခလုတ်ကို ထိရင်ဖြစ်ဖြစ်၊ နှိပ်ရင်ဖြစ်ဖြစ် ပတ်ပြေးခိုင်းတဲ့ Code
        function moveButton() {
            // ဖုန်း Screen အကျယ်အဝန်းကို တွက်ချက်တာပါ
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // ချစ်တယ် ခလုတ်ကို နှိပ်လိုက်ရင် ဖြစ်သွားမယ့် Code
        function selectYes() {
            title.innerText = "Yeeyy!!! 🎉💖";
            subtitle.innerText = "ပြန်ချစ်လို့ ကျေးဇူးတင်ပါတယ်ခင်ဗျာာာ စိတ်ချပါ အမြဲပျော်အောင်ထားပါ့မယ်။";
            bearGif.src = "https://media.tenor.com/w9K8fO50U7kAAAAi/milk-and-mocha-bear.gif"; // ပျော်သွားတဲ့ပုံပြောင်းတာ
            noBtn.style.display = 'none'; // မချစ်ဘူးခလုတ်ကို ဖျောက်လိုက်တာ
        }
    </script>

</body>
</html>
